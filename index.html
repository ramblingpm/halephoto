<script>
  // Show up to MAX photos, picked and ordered at random on each visit.
  // To add a photo: put it in photos/ (plus -800 and -1400 wide copies)
  // and add an <img> line above, copying the srcset/sizes pattern.
  var MAX = 5;
  var main = document.getElementById('photos');
  var imgs = Array.prototype.slice.call(main.querySelectorAll('img'));
  for (var i = imgs.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = imgs[i]; imgs[i] = imgs[j]; imgs[j] = t;
  }
  main.textContent = '';
  imgs.slice(0, MAX).forEach(function (img, k) {
    img.decoding = 'async';
    if (k > 0) img.loading = 'lazy';
    main.appendChild(img);
  });
</script>
