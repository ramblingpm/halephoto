<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hale Photo</title>
<style>
  :root { --bg: #f7f6f3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141413; } }
  html, body { margin: 0; background: var(--bg); }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 6vh 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10vh;
  }
  img {
    display: block;
    max-width: 100%;
    max-height: 88vh;
    width: auto;
    height: auto;
  }
</style>
</head>
<body>
<main>
  <img src="photos/01.jpg" width="2000" height="1333" alt="Photo 1">
  <img src="photos/02.jpg" width="1333" height="2000" alt="Photo 2" loading="lazy">
  <img src="photos/03.jpg" width="2000" height="2000" alt="Photo 3" loading="lazy">
  <img src="photos/04.jpg" width="2000" height="1333" alt="Photo 4" loading="lazy">
  <img src="photos/05.jpg" width="1333" height="2000" alt="Photo 5" loading="lazy">
  <img src="photos/06.jpg" width="2000" height="1333" alt="Photo 6" loading="lazy">
</main>
</body>
</html>
